name: Validar e publicar no GitHub Pages

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Testes e build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Configurar Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      # O projeto não tem dependências ou lockfile; não há instalação necessária.
      - name: Testar
        run: npm test
      - name: Gerar arquivos estáticos
        run: npm run build
      - name: Validar artefato e caminhos para /algo-kids/
        run: node scripts/validate-dist.js
      - name: Preparar artefato do Pages
        if: github.ref == 'refs/heads/main' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    name: Publicar
    needs: build
    if: github.ref == 'refs/heads/main' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      pages: write
      id-token: write
    concurrency:
      group: github-pages
      cancel-in-progress: false
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Configurar GitHub Pages
        uses: actions/configure-pages@v5
      - name: Publicar artefato validado
        id: deployment
        uses: actions/deploy-pages@v4
      - name: Exibir endereço publicado
        env:
          PAGE_URL: ${{ steps.deployment.outputs.page_url }}
        run: printf 'Publicado em %s\n' "$PAGE_URL" >> "$GITHUB_STEP_SUMMARY"
